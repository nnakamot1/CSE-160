<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>First-Person World – CSE 160 Asgn 4</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
    canvas { display: block; cursor: crosshair; border: 2px solid #444; margin-top: 8px; }
    #hud { font-size: 0.85em; color: #aaa; margin: 4px 0; }
    #controls { font-size: 0.78em; color: #777; margin-bottom: 6px; text-align: center; line-height: 1.6; }
  </style>
</head>
<body>

<canvas id="webgl" width="800" height="600"></canvas>
<div id="hud"><span id="fps">FPS: --</span> &nbsp;|&nbsp; Click canvas to lock mouse pointer</div>
<div style="display:flex;align-items:center;gap:10px;margin:4px 0;">
  <span style="font-size:0.8em;color:#aaa;white-space:nowrap;">Bessie's Happiness</span>
  <div style="background:#333;width:200px;height:14px;border-radius:6px;overflow:hidden;border:1px solid #555;">
    <div id="pet-bar" style="height:100%;width:100%;background:#44dd44;transition:width 0.4s,background 0.4s;"></div>
  </div>
</div>
<div id="story" style="font-size:0.9em;color:#ffe066;margin:4px 0;min-height:1.2em;">
  Bessie is happy! Keep her company.
</div>
<div id="controls">
  <strong>WASD</strong> move &nbsp;|&nbsp;
  <strong>Q/E</strong> turn &nbsp;|&nbsp;
  <strong>Mouse drag</strong> look &nbsp;|&nbsp;
  <strong>F</strong> pet cow / add block &nbsp;|&nbsp;
  <strong>G</strong> remove block &nbsp;|&nbsp;
  <strong>Click</strong> lock pointer for smooth look
</div>

<script src="../asgn1/lib/cuon-utils.js"></script>
<script src="../asgn0/lib/cuon-matrix-cse160.js"></script>
<script src="camera.js"></script>
<script src="asgn4.js"></script>
<script>window.onload = main;</script>
</body>
</html>
